[project]
name = "raptor-rag"
version = "0.1.0"
description = "Document Q&A with knowledge bases, hybrid retrieval and RAPTOR trees"
authors = [
    { name = "HumdaanSyed", email = "humdaansyed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "pydantic-settings>=2.10",
    "qdrant-client>=1.15",
    "pymupdf>=1.26",
    "python-multipart>=0.0.20",
    "openai>=2",
    "umap-learn>=0.5.9",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
# Heavy (torch); kept out of the default install so CI and tests stay light.
ml = ["FlagEmbedding>=1.3"]

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.15", "pyright>=1.1.400"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain guard: ignore releases newer than this date (bump deliberately).
exclude-newer = "2026-10-04"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
